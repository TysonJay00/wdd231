        <section class="feedback">
            <h2>Batman Fan Feedback</h2>


            <form action="form.html" method="get">
                <label for="fan-name">Your Name:</label>
                <input type="text" id="fan-name" name="name" required>

                <label for="character">Favourite Batman Villian:</label>
                <select id="character" name="character" required>
                    <option value="">-- Choose a character --</option>
                    <option value="The Joker">The Joker</option>
                    <option value="Bane">Bane</option>
                    <option value="Harley Quinn">Harley Quinn</option>
                    <option value="Catwoman">Catwoman</option>
                    <option value="The Riddler">The Riddler</option>
                    <option value="The Scarecrow">The Scarecrow</option>
                    <option value="Mr. Freeze">Mr. Freeze</option>
                    <option value="Poison Ivy">Poison Ivy</option>
                </select>

                <label for="comments">Why do you like this character?</label>
                <textarea id="comments" name="comments" rows="5" required></textarea>

                <button type="submit">Submit Feedback</button>
            </form>


        </section>
